# NF Log -- painel (gerado pelo instalador). Certificado próprio em
# /etc/nflog/tls; para trocar por um válido, aponte ssl_certificate para ele.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" (e não "http2 on"): o nginx 1.22 do Debian 12 só conhece esta forma.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/nflog/tls/nflog.crt;
    ssl_certificate_key /etc/nflog/tls/nflog.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root @APP@/public;
    index index.php;
    client_max_body_size 2m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php@PHP@-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
