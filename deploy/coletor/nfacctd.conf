! NF Log -- log de NAT do CGNAT (gerado pelo instalador).
! Os roteadores mandam os eventos de NAT (criação/fim de sessão) por IPFIX.
! Fica só o que identifica o assinante, sem destino: registro de conexão
! (art. 13 do Marco Civil), no espírito da RFC 8158. O nfacctd grava por
! minuto em /var/spool/nflog-nat e o nflog-nat-filtrar guarda os eventos
! 4/5 de origem interna em @BASE@/arquivo/nat-<IP do roteador>/.
daemonize: false
! IPv4: em socket IPv6 o remetente vira ::ffff:x.x.x.x e não bate com a lista de permitidos.
nfacctd_ip: 0.0.0.0
nfacctd_port: 2055
nfacctd_allow_file: /etc/nflog/nfacctd-permitidos.txt
nfacctd_disable_checks: true
! plugin_buffer_size fica no padrão (um registro): o núcleo só passa ao plugin
! quando o buffer enche, e um buffer grande segura os eventos de quem tem pouco tráfego.
plugin_pipe_size: 10240000
plugins: print[nat]
aggregate[nat]: peer_src_ip, nat_event, proto, src_host, src_port, post_nat_src_host, post_nat_src_port, timestamp_start, timestamp_end
print_output[nat]: json
print_output_file[nat]: /var/spool/nflog-nat/%Y%m%d-%H%M.json
print_output_file_append[nat]: false
print_trigger_exec[nat]: /usr/local/sbin/nflog-nat-filtrar
print_refresh_time[nat]: 60
print_history[nat]: 1m
print_history_roundoff[nat]: m
