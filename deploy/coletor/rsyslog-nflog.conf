# NF Log -- recepção do syslog dos equipamentos (gerado pelo instalador; não
# edite aqui, edite /etc/nflog/nflog.conf e rode o instalador de novo).
#
# Cada mensagem vai para dois lugares:
#  - o arquivo bruto @BASE@/arquivo/<IP de origem>/<AAAA-MM-DD>.log, que o
#    nflog-fechar-dia compacta, resume (SHA-256) e assina todo dia;
#  - o VictoriaLogs (127.0.0.1:5140), só para pesquisa, com o IP de origem
#    no campo origem_ip.
module(load="imudp")
module(load="imtcp" MaxSessions="200")
module(load="imfile" mode="inotify")

$AllowedSender UDP, 127.0.0.1, @REDES@
$AllowedSender TCP, 127.0.0.1, @REDES@

template(name="nflogArquivo" type="string" string="@BASE@/arquivo/%FROMHOST-IP%/%$YEAR%-%$MONTH%-%$DAY%.log")
template(name="nflogLinha" type="string" string="%TIMEGENERATED:::date-rfc3339% %FROMHOST-IP% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
template(name="nflogVL" type="string" string="<%PRI%>1 %TIMESTAMP:::date-rfc3339% %HOSTNAME% %APP-NAME% %PROCID% %MSGID% [nflog@32473 origem_ip=\"%FROMHOST-IP%\"] %msg:::drop-last-lf%\n")

ruleset(name="nflogColetor") {
    action(type="omfile" dynaFile="nflogArquivo" template="nflogLinha" dynaFileCacheSize="200"
           dirCreateMode="0750" fileCreateMode="0640" dirGroup="nflog" fileGroup="nflog")
    action(type="omfwd" target="127.0.0.1" port="5140" protocol="tcp" template="nflogVL" TCP_Framing="octet-counted"
           queue.type="LinkedList" queue.filename="nflog_vl" queue.maxDiskSpace="1g"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
}

input(type="imudp" port="514" ruleset="nflogColetor")
input(type="imtcp" port="514" ruleset="nflogColetor")

# Log de NAT (gravado pelo nflog-nat-filtrar, uma pasta por roteador): o arquivo
# já é o bruto, aqui só vai para a pesquisa, com app_name nat-cgnat.
input(type="imfile" File="@BASE@/arquivo/nat-*/*.log" Tag="nat-cgnat:" Facility="local1" Severity="info" ruleset="nflogNat")
ruleset(name="nflogNat") {
    action(type="omfwd" target="127.0.0.1" port="5140" protocol="tcp" template="nflogVL" TCP_Framing="octet-counted"
           queue.type="LinkedList" queue.filename="nflog_nat" queue.maxDiskSpace="2g"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
}
