# NF Log: o unit do Debian é do tipo forking e trava com daemonize: false.
[Service]
Type=simple
ExecStart=
ExecStart=/usr/sbin/nfacctd -f /etc/pmacct/nfacctd.conf
Restart=on-failure
MemoryMax=300M
Nice=5
# No SIGTERM ele espera os plugins gravarem; não segurar o restart por 90 s.
TimeoutStopSec=15
